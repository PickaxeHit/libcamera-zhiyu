%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      # 16 at 10 bits, in the 16-bit scale the tuning file uses.
      blackLevel: 4096
  - Awb:
  - Ccm:
      # Approximate, not measured from a colour chart: it opens up the
      # green-dominant response of the sensor enough for skin tones to look
      # plausible.
      ccms:
        - ct: 6500
          ccm: [ 1.45, -0.30, -0.15,
                -0.25,  1.40, -0.15,
                -0.15, -0.30,  1.45 ]
  - Adjust:
  - Agc:
  # The dw9807 lens is driven by the contrast-detect autofocus.  There is no
  # calibrated lens map yet, so the dioptre values are relative: the range
  # stops short of the far end (where the software scan only finds sensor
  # noise) and the contrast ratio is relaxed, otherwise a low-contrast scene
  # reports a failed scan instead of the best position found.
  - Af:
      ranges:
        normal:
          min: 0.0
          max: 15.0
          default: 2.0
      speeds:
        normal:
          step_coarse: 1.0
          step_fine: 0.25
          contrast_ratio: 0.95
      skip_frames: 4
...
